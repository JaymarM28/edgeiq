name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://edgeiq:edgeiq@localhost:5432/edgeiq
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test (api)
        run: pnpm --filter @edgeiq/api test

      - name: Build
        run: pnpm build
